name: One-time completed-branch cleanup (Ultima5-Lazarus-KR)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-completed-branches-once.yml'
permissions:
  contents: write
jobs:
  cleanup:
    if: github.repository == 'munument1/Ultima5-Lazarus-KR'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const targets=[{"name":"agent/fix-korean-font-map","sha":"e00fbfabd75d676dfde1fcce27a3f528fe84c120","pr":3},{"name":"agent/fix-smartheap-language-dll","sha":"0a483f608c7c672edf0b97d3a3707f9106ed5921","pr":4},{"name":"agent/publish-b102-reaudit","sha":"b29165ecddf58941d6b75a1a911fc4482784f347","pr":5},{"name":"agent/publish-korean-patch","sha":"c666f921a010d665fea7047d49c260f6d3eafef0","pr":2},{"name":"agent/release-b102","sha":"713842a28a548ff7348bc96b93cd38cd36daaf97","pr":6},{"name":"agent/release-b104","sha":"3cf4560b59355c24b1edc228b14fed2949b14c37","pr":8}];
            const owner=context.repo.owner,repo=context.repo.repo;
            if(owner!=='munument1'||repo!=="Ultima5-Lazarus-KR"||context.ref!=="refs/heads/main")throw Error('Wrong repository or branch');
            const open=await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100});
            const blocked=new Set(open.flatMap(p=>[p.head.ref,p.base.ref]));
            let deleted=0;const skipped=[];
            for(const c of targets){
             if(c.name==="main"||c.name==='gh-pages'||blocked.has(c.name)){skipped.push(c.name+': policy/PR');continue;}
             let b;try{b=(await github.rest.repos.getBranch({owner,repo,branch:c.name})).data}catch(e){skipped.push(c.name+': missing');continue;}
             if(b.protected||b.commit.sha!==c.sha){skipped.push(c.name+': changed/protected');continue;}
             if(c.pr!==null){
              const p=(await github.rest.pulls.get({owner,repo,pull_number:c.pr})).data;
              if(!p.merged_at||p.base.ref!=="main"||p.head.ref!==c.name||p.head.sha!==c.sha){skipped.push(c.name+': PR changed');continue;}
             }else{
              const cmp=(await github.rest.repos.compareCommitsWithBasehead({owner,repo,basehead:"main..."+c.name})).data;
              if(cmp.ahead_by!==0){skipped.push(c.name+': unique commits');continue;}
             }
             await github.rest.git.deleteRef({owner,repo,ref:'heads/'+c.name});
             deleted++;core.info('DELETED '+c.name);
            }
            for(const s of skipped)core.warning('SKIPPED '+s);
            core.info('Completed '+deleted+' deletions of '+targets.length+' candidates; '+skipped.length+' skipped');
            await core.summary.addHeading('Completed branch cleanup').addRaw('Deleted '+deleted+' of '+targets.length+'; skipped '+skipped.length+'.').write();
